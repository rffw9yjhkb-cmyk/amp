    --line:#E4E1D9; --line2:#CFCBC0;

  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);
    font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;

  a{color:inherit}

  header{display:flex;justify-content:space-between;align-items:center;
    padding:22px 5vw;border-bottom:1px solid var(--line)}
  .logo{font-size:19px;font-weight:300;letter-spacing:.34em;color:var(--text);text-decoration:none}
  .hlabel{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--sub)}
  .wrap{max-width:720px;margin:0 auto;padding:56px 5vw 90px}
  .slabel{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--sub);margin-bottom:22px}
  .card{border:1px solid var(--line);background:var(--bg);padding:clamp(24px,5vw,40px)}
  dl.summary{border-top:1px solid var(--line)}
  dl.summary .row{display:flex;justify-content:space-between;gap:16px;padding:15px 2px;border-bottom:1px solid var(--line);font-size:14px}
  dl.summary dt{color:var(--sub);font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding-top:3px;white-space:nowrap}
  dl.summary dd{font-weight:400;letter-spacing:.05em;text-align:right}
  .fineprint{font-size:11.5px;color:var(--faint);margin-top:16px;line-height:1.8}
  .backlink{display:inline-block;margin-top:34px;font-size:12px;letter-spacing:.18em;color:var(--sub);text-decoration:none;border-bottom:1px solid var(--line2);padding-bottom:2px}
  .backlink:hover{color:var(--text);border-color:var(--text)}
  footer{border-top:1px solid var(--line);padding:44px 5vw;text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:.14em}
  .flogo{font-size:15px;letter-spacing:.34em;color:var(--sub);margin-bottom:12px}
  footer a{color:var(--sub)}
</style>
